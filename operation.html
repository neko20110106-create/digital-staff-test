/* Station transitions and operation-state border accents */
@keyframes stationFadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes departBorder{0%{border-color:#d98b5c;box-shadow:0 0 0 0 rgba(217,139,92,0)}35%{border-color:#ffad70;box-shadow:0 0 0 4px rgba(217,139,92,.22)}100%{border-color:#d98b5c;box-shadow:0 0 0 0 rgba(217,139,92,0)}}

.station-name.station-fade,.timeline-station{animation:stationFadeIn .32s ease-out both}
.timeline-row.next.running-next{animation:departBorder .7s ease-out}
.timeline-row.current{animation:stopBorder .7s ease-out}
.mainstation.depart-flash{animation:departBorder .7s ease-out}

 .station-name.station-fade,.timeline-station,.timeline-row.next.running-next,.timeline-row.current,.mainstation.depart-flash,.mainstation.stop-flash,.clock.clock-tick{animation:none!important}

document.body.classList.toggle("animations-off",!animationsEnabled());

const initial={"train":"729M","kind":"普通","dest":"熱海","line":"東海道線 / 下り","cars":"","stations":[{"name":"東京","arr":"","dep":"06:05:00","stop":"停車"},{"name":"新橋","arr":"06:07:00","dep":"06:08:00","stop":"停車"},{"name":"品川","arr":"06:13:00","dep":"06:16:00","stop":"停車"},{"name":"川崎","arr":"06:26:00","dep":"06:26:00","stop":"停車"},{"name":"横浜","arr":"06:35:00","dep":"06:36:00","stop":"停車"},{"name":"戸塚","arr":"06:45:00","dep":"06:46:00","stop":"停車"},{"name":"大船","arr":"06:51:00","dep":"06:52:00","stop":"停車"}]};
let d=JSON.parse(localStorage.getItem("staff")||"null")||initial,idx=0,state="停車中",delay=Number(localStorage.getItem("staffDelay")||0),seconds=0,last=Date.now(),started=localStorage.getItem("staffRunActive")==="true";
const displayCount=()=>{const saved=localStorage.getItem("staffDisplayCount");const value=saved===null?d.displayCount:Number(saved);return Math.max(2,Math.min(20,Math.floor(Number(value)||5)))};
$("headerDisplayCount").value=String(displayCount());$("headerDisplayCount").onchange=()=>{const n=Math.max(2,Math.min(20,Number($("headerDisplayCount").value)||5));localStorage.setItem("staffDisplayCount",String(n));d.displayCount=n;renderTabletTimeline();};
function plus(t,m){if(!t)return "";let [h,n,s=0]=t.split(":").map(Number);const total=(h*60+n+m+14400)%1440;return (total/60|0)+":"+String(total%60).padStart(2,"0")+":"+String(s||0).padStart(2,"0")}function stationTimeText(s,mode){if(!s)return "";const t=s.stop==="通過"?(s.arr||s.dep):(mode==="arr"?(s.arr||s.dep):mode==="dep"?(s.dep||s.arr):(s.dep||s.arr));if(!t)return "";return (s.stop==="通過"?"通 ":mode==="arr"?"着 ":"発 ")+plus(t,delay)}
function timelineTimeText(s,mode){const value=stationTimeText(s,mode);return value.replace(/^通 /,"")}
let previousRenderState=null;function animationPrefs(){const defaults={station:true,depart:true,stop:true,clock:true,page:true};try{return {...defaults,...JSON.parse(localStorage.getItem("staffAnimationPrefs")||"{}")}}catch{return defaults}}function animationsEnabled(){return localStorage.getItem("staffAnimations")!=="false"}function applyAnimationPrefs(){const p=animationPrefs();document.body.classList.toggle("anim-station",animationsEnabled()&&p.station!==false);document.body.classList.toggle("anim-depart",animationsEnabled()&&p.depart!==false);document.body.classList.toggle("anim-stop",animationsEnabled()&&p.stop!==false);document.body.classList.toggle("anim-clock",animationsEnabled()&&p.clock!==false);document.body.classList.toggle("anim-page",animationsEnabled()&&p.page!==false)}function pageTransitionTo(url){if(!animationsEnabled()||animationPrefs().page===false){location.href=url;return}document.body.classList.add("page-exit");setTimeout(()=>location.href=url,240)}function replayAnimation(el,cls){if(!el||!animationsEnabled())return;const p=animationPrefs();if((cls==="station-fade"&&p.station===false)||(cls==="depart-flash"&&p.depart===false)||(cls==="stop-flash"&&p.stop===false))return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function render(){const a=d.stations[idx],b=d.stations[idx+1];$("trainNo").textContent=d.train||"—";$("kind").textContent=d.kind||"—";$("dest").textContent=d.dest||"—";$("line").textContent=d.line||"—";$("cars").textContent=d.cars?(/両$/.test(String(d.cars))?String(d.cars):String(d.cars)+"両"):"未設定";$("progress").textContent=(d.stations.length?idx+1:0)+" / "+d.stations.length+" 駅";$("state").textContent=state;$("stationLabel").textContent=state==="運転中"||state==="通過"?"次駅":"現在駅";$("stationName").textContent=a?.name||"—";$("stationTime").textContent=a?stationTimeText(a,state==="運転中"?"arr":"dep"):"";$("mainStation").classList.toggle("arrived",state!=="運転中"&&state!=="通過");if(previousRenderState!==null&&previousRenderState!==state){replayAnimation($("mainStation"),state==="運転中"||state==="通過"?"depart-flash":"stop-flash");replayAnimation($("stationName"),"station-fade")}previousRenderState=state;$("nextLine").innerHTML=b?'次駅 <strong>'+escapeHtml(b.name)+'</strong>':"次駅 <strong>終点</strong>";renderTabletTimeline();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function protectionChangeHtml(station){if(!station||station.protectionChange!==true)return "";const from=String(station.protectionFrom||"").trim(),to=String(station.protectionTo||"").trim();if(!from&&!to)return "";return '<span class="protection-change">'+escapeHtml(from||"—")+' → '+escapeHtml(to||"—")+'</span>'}
function tabletPortrait(){return window.matchMedia("(orientation:landscape), (max-width:699px), (min-width:700px) and (max-width:1300px) and (orientation:portrait)").matches}
function renderTabletTimeline(){const el=$("tabletTimeline");if(!el)return;const stations=d.stations||[];if(!stations.length){el.innerHTML='<div class="timeline-row current"><span class="timeline-label">現在地</span><strong class="timeline-station">—</strong></div>';return}
 const isRunning=state==="運転中"||state==="通過";
 const current=Math.max(0,Math.min(isRunning?idx-1:idx,stations.length-1));
 const next=current+1;
 const maxRows=displayCount();
 const futureCount=Math.max(1,maxRows-(isRunning?0:1));
 const futureEnd=Math.min(stations.length-1,next+futureCount-1);
 let html="";
 for(let i=futureEnd;i>next;i--){const s=stations[i];const pass=s.stop==="通過";const time=timelineTimeText(s,"arr");html+='<div class="timeline-row"><span class="timeline-label '+(pass?"kind-pass":"kind-stop")+'">'+(pass?"通過":"停車")+'</span><div class="timeline-info"><div class="timeline-main"><strong class="timeline-station">'+escapeHtml(s.name||"—")+'</strong>'+(time?'<span class="timeline-kind">'+time+'</span>':"")+'</div>'+protectionChangeHtml(s)+'</div></div>'}
 if(next<stations.length){if(next<stations.length-1){const segment=stations[next+1];const slow=segment?.slow===true;const speed=segment?.slowSpeed;html+='<div class="timeline-track" aria-hidden="true"><span class="timeline-slow-sign" '+(slow?"":"hidden")+'>'+(speed?"徐行 "+escapeHtml(speed)+" km/h":"徐行")+'</span></div>';}const s=stations[next];const pass=s.stop==="通過";const time=timelineTimeText(s,"arr");html+='<div class="timeline-row next '+(isRunning?"running-next":"stopped-next")+'"><span class="timeline-label '+(pass?"kind-pass":"kind-stop")+'">'+(pass?"通過":"停車")+'</span><div class="timeline-info"><div class="timeline-main"><strong class="timeline-station">'+escapeHtml(s.name||"—")+'</strong>'+(time?'<span class="timeline-time">'+time+'</span>':"")+'</div>'+protectionChangeHtml(s)+'</div></div></div>'}
 if(next>0&&next<stations.length){const slow=stations[next]?.slow===true;const speed=stations[next]?.slowSpeed;html+='<div class="timeline-track" aria-hidden="true"><span class="timeline-slow-sign" '+(slow?"":"hidden")+'>'+(speed?"徐行 "+escapeHtml(speed)+" km/h":"徐行")+'</span></div>'}
 if(!isRunning){const here=stations[current];const time=stationTimeText(here,"dep");html+='<div class="timeline-row current"><span class="timeline-label">現在地</span><div class="timeline-info"><div class="timeline-main"><strong class="timeline-station">'+escapeHtml(here.name||"—")+'</strong>'+(time?'<span class="timeline-time">'+time+'</span>':"")+'</div>'+protectionChangeHtml(here)+'</div></div></div>'}
 el.innerHTML=html;
 if(window.matchMedia("(max-width:600px)").matches){el.querySelectorAll(".timeline-station").forEach(node=>{node.style.whiteSpace="nowrap";node.style.overflowWrap="normal";let size=parseFloat(getComputedStyle(node).fontSize)||24;const min=node.closest(".current")?13:12;while(node.scrollWidth>node.clientWidth+1&&size>min){size-=0.5;node.style.fontSize=size+"px";}});}
 const target=stations[next];const action=$("tabletMainAction");if(state==="停車中"&&idx>=stations.length-1){action.textContent="運転終了";action.classList.remove("pass-mode");action.classList.add("end-mode");action.disabled=false}else if(state==="停車中"){action.textContent="発車";action.classList.remove("pass-mode","end-mode");action.disabled=current>=stations.length-1}else if(target&&target.stop==="通過"){action.textContent="通過";action.classList.remove("end-mode");action.classList.add("pass-mode");action.disabled=false}else{action.textContent="停車";action.classList.remove("pass-mode","end-mode");action.disabled=!target}
 $("tabletBack").disabled=current<=0;$("tabletAdvance").disabled=current>=stations.length-1;$("tabletHint").textContent=state==="停車中"?"停車中：次駅を確認して「発車」":target?(target.stop==="通過"?"次駅は通過駅です":"次駅は停車駅です"):"終点です";
}
function msg(t){}
$("depart").onclick=()=>{if(idx>=d.stations.length-1){state="終点";render();msg("終点のため次駅はありません");return}idx++;state="運転中";render();msg(d.stations[idx].name+" を次駅として表示中")};
$("arrive").onclick=()=>{state="停車中";seconds=0;last=Date.now();$("clock").textContent="00:00:00";render();msg(d.stations[idx]?.name+" を現在駅として表示中。経過時間をリセットしました")};
$("pass").onclick=()=>{if(idx>=d.stations.length){state="終点";render();msg("終点のため通過できる駅はありません");return}const passed=d.stations[idx]?.name||"駅";if(idx<d.stations.length-1){idx++;state="通過";render();msg(passed+" を通過扱いにしました。次駅："+d.stations[idx].name)}else{state="終点";render();msg(passed+" を通過扱いにしました。終点です")}};
$("advance").onclick=()=>{if(idx<d.stations.length-1){idx++;state=d.stations[idx].stop==="通過"?"通過":"停車中";render();msg("次駅へ進みました")}else msg("終点です")};
$("back").onclick=()=>{idx=Math.max(0,idx-1);state="停車中";render();msg("1駅戻りました")};
$("reset").onclick=()=>{idx=0;state="停車中";seconds=0;last=Date.now();if(started)localStorage.setItem("staffRunActive","true");else localStorage.removeItem("staffRunActive");$("clock").textContent="00:00:00";$("tabletBack").disabled=false;$("tabletAdvance").disabled=false;$("tabletMainAction").disabled=false;render();msg("リセットしました")};

$("tabletBack").onclick=()=>{$("back").click()};const finishRun=()=>{if(!confirm("運転を終了して設定画面に戻りますか？"))return;started=false;localStorage.removeItem("staffRunActive");pageTransitionTo("index.html")};$("endRun").onclick=finishRun;$("headerEndRun").onclick=finishRun;$("headerReset").onclick=()=>$("reset").click();
$("tabletReset").onclick=()=>{$("reset").click()};
$("tabletAdvance").onclick=()=>{$("depart").click()};
$("tabletMainAction").onclick=()=>{if(state==="停車中"&&idx>=d.stations.length-1){finishRun();return}if(state==="停車中"){if(idx>=d.stations.length-1)return;idx++;state="運転中";render();msg(d.stations[idx].name+" に向けて発車しました");return}
 if(idx>=d.stations.length)return;
 const target=d.stations[idx];
 if(target.stop==="通過"){const passed=target.name;idx=Math.min(idx+1,d.stations.length-1);state="運転中";render();msg(passed+" を通過しました")}else{state="停車中";seconds=0;last=Date.now();$("clock").textContent="00:00:00";render();msg(target.name+" に停車しました")}};
window.addEventListener("resize",()=>{if(tabletPortrait())renderTabletTimeline()});document.body.classList.add("page-enter");


function tick(){if(!started)return;let n=Date.now();seconds+=Math.floor((n-last)/1000);last=n;const value=[seconds/3600|0,seconds%3600/60|0,seconds%60].map(v=>String(v).padStart(2,"0")).join(":");const clock=$("clock");if(clock.textContent!==value){clock.textContent=value;if(animationPrefs().clock!==false)replayAnimation(clock,"clock-tick")}}setInterval(tick,1000);render();
</script></body></html>
